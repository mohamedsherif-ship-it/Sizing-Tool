function parseRows(R,nm){const f=s=>R.findIndex(r=>String(r[0]).trim().toLowerCase()===s.toLowerCase()),v=(s,c=1)=>{const i=f(s);return i<0?'':R[i][c]};

 const H0=R[f('Breakers per section')]||[],col={};H0.forEach((t,i)=>{const m=/^Section (\d)( \(busway\))?$/i.exec(String(t).trim());if(m)col[m[1]+(m[2]?'b':'')]=i});

  R.forEach(r=>{const m=pmodel(r[0]);if(!m)return;const n=+r[c]||0,nb=cb===undefined?0:(+r[cb]||0);
   if(n){q[m.t]=(q[m.t]||0)+n;(am[m.t]=am[m.t]||[]).push(...Array(n).fill(m.a))}

function busbars(pn,r){const fl=[];let x=0;r.sg.forEach(sg=>sg.g.forEach(g=>g.p.forEach(p=>{const w=p.w+(p.e||0);fl.push({p,x0:x,x1:x+w,sn:sg.n});x+=w})));

  if(pc&&pfc.length){const c0=(pc.x0+pc.x1)/2,far=pfc.map(o=>(o.x0+o.x1)/2).sort((p,q)=>Math.abs(q-c0)-Math.abs(p-c0))[0],cus=ps.filter(o=>o.p.cu),n=cus.length||1,amp=sec.pfa||0;

   bb.pfv.push({sec:si+1,xs:cus.map(o=>(o.x0+o.x1)/2),n,each:amp/n})}
  ps.filter(o=>o.p.k==='xt'&&o.p.items).forEach(o=>{const it=o.p.items.filter(i=>!i.pf);if(!it.length)return;const sum=it.reduce((q,i)=>q+(i.a||0),0),df=DFN(it.length),des=sum*df;
   bb.vd.push({sec:si+1,x0:o.x0,x1:o.x1,n:it.length,sum,df,des,rating:upS(des),desc:o.p.lines.filter(l=>!/^PF /.test(l)).join(', ')})})});

function cuRows(pn,bb){const amb=pn.amb||40,ph=3+(NF[pn.neu]!==undefined?NF[pn.neu]:.5)+(EF[pn.ear]!==undefined?EF[pn.ear]:.25),rows=[];
